services:
  kairo:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/bongo-devs/kairo:latest
    container_name: kairo
    restart: unless-stopped
    ports:
      - "2333:2333"
    # Deliberately no `ulimits.nofile` pin: Docker's default is usually 1048576
    # (524288 measured on this host) and any pinned value risks *lowering* the
    # limit on hosts already above it. A 1000-guild fleet needs a few thousand
    # descriptors (TCP+UDP per voice connection plus HTTP pools). Verify with
    # `docker inspect kairo --format '{{.HostConfig.Ulimits}}'` and only pin a
    # value at or above what is already there.
    volumes:
      - ./application.yml:/app/application.yml:ro
      - ./logs:/app/logs
    environment:
      - RUST_LOG=info
      - KAIRO_CONFIG=/app/application.yml
      # Commit arena pages on demand rather than up front, worth about 12 MB at idle.
      - MIMALLOC_ARENA_EAGER_COMMIT=0
