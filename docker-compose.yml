services:
  kairo:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/bongo-devs/kairo:latest
    container_name: kairo
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./application.yml:/app/application.yml:ro
      - ./logs:/app/logs
    environment:
      - RUST_LOG=info
      - KAIRO_CONFIG=/app/application.yml
      # Commit arena pages on demand rather than up front, worth about 12 MB at idle.
      - MIMALLOC_ARENA_EAGER_COMMIT=0
