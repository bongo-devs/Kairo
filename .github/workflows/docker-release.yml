name: Release Pipeline
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit:
        description: "Specific commit SHA (leave empty for latest)"
        required: false
        default: ""
permissions:
  contents: read
  packages: write
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Authenticate for the private dependencies
        env:
          TOKEN: ${{ secrets.CARGO_GIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_GIT_TOKEN is unset, so cargo cannot fetch the git dependencies"
            exit 1
          fi
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            https://github.com/

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Install the aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin kairo

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/release/kairo \
             target/${{ matrix.target }}/release/kairo-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: kairo-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/kairo-linux-${{ matrix.arch }}

  docker:
    name: Build & Push Docker Image
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: kairo-linux-*

      - name: Organize binaries
        run: |
          mkdir -p bin/linux/amd64 bin/linux/arm64
          mv bin/kairo-linux-amd64/kairo-linux-amd64 bin/linux/amd64/kairo
          mv bin/kairo-linux-arm64/kairo-linux-arm64 bin/linux/arm64/kairo
          chmod +x bin/linux/amd64/kairo bin/linux/arm64/kairo

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
