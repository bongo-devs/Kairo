name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate for the private dependencies
        env:
          TOKEN: ${{ secrets.CARGO_GIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_GIT_TOKEN is unset, so cargo cannot fetch the git dependencies"
            exit 1
          fi
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            https://github.com/

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose
